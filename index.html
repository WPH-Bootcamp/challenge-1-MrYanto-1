<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge-1 Simple Landing Page with HTML and CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Color+Emoji&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <a href="">
        <img src="assets/Area.svg" alt="Area Logo" id="logo" />
      </a>
      <nav>
        <ul id="navbar">
          <li><a href="#benefits">Benefits</a></li>
          <li><a href="#specifications">Specifications</a></li>
          <li><a href="#how">How-to</a></li>
          <li><a href="#contact">Contact Us</a></li>
        </ul>
      </nav>
      <button class="cta">Learn More ></button>
    </header>

    <main>
      <section id="hero">
        <h1>Browse everything</h1>
        <div id="heroImage">
          <div id="rectangle"></div>
          <img src="./assets/hero.svg" alt="Hero Ipad" id="ipad" />
        </div>
      </section>

      <section id="logoCloud">
        <p>Trusted by:</p>
        <div id="logoImages">
          <img src="./assets/logo1.svg" alt="logo 1 image" />
          <img src="./assets/logo2.svg" alt="logo 2 image" />
          <img src="./assets/logo3.svg" alt="logo 3 image" />
          <img src="./assets/logo4.svg" alt="logo 4 image" />
          <img src="./assets/logo5.svg" alt="logo 5 image" />
          <img src="./assets/logo6.svg" alt="logo 6 image" />
        </div>
      </section>
    </main>
  </body>
</html>
